<section class="form-card" id="profile"><h2>프로필</h2><form class="admin-form" method="post" action="/account/profile"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="form-grid two"><label>아이디<input value="{{ member.username }}" readonly></label><label>닉네임<input name="nickname" required minlength="2" maxlength="30" value="{{ member.nickname }}"></label></div><button class="primary-inline" type="submit">프로필 저장</button></form></section>
  <section class="form-card" id="password"><h2>비밀번호 변경</h2><p class="member-help">변경하면 다른 기기의 로그인은 모두 해제됩니다.</p><form class="admin-form" method="post" action="/account/password"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>현재 비밀번호<input type="password" name="current_password" required maxlength="128" autocomplete="current-password"></label><div class="form-grid two"><label>새 비밀번호<input type="password" name="password" required minlength="12" maxlength="128" autocomplete="new-password"></label><label>새 비밀번호 확인<input type="password" name="password_confirm" required minlength="12" maxlength="128" autocomplete="new-password"></label></div><button class="primary-inline" type="submit">비밀번호 변경</button></form></section>
  <section class="form-card account-withdraw" id="withdraw"><p class="kicker">계정 관리</p><h2>회원 탈퇴</h2><p class="member-help">탈퇴하면 로그인이 해제되고 아이디·닉네임·비밀번호 해시는 계정에서 제거됩니다. 작성한 글은 ‘탈퇴한 사용자’로 유지되며, 등록한 장소와 수정 제안도 보존됩니다. 승인된 ISSUE의 수정·삭제가 필요하다면 탈퇴 전에 문의해주세요. 탈퇴 후에는 내 문의와 답변을 열 수 없습니다.</p><details><summary>탈퇴 진행하기</summary><form class="admin-form" method="post" action="/account/delete"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>현재 비밀번호<input type="password" name="current_password" required maxlength="128" autocomplete="current-password"></label><label class="member-check"><input type="checkbox" name="confirm_delete" value="yes" required>계정은 복구할 수 없으며 작성한 글이 유지되는 것을 확인했습니다.</label><button class="mini-btn danger" type="submit">회원 탈퇴</button></form></details></section>
