<div class="collection-grid">{% for c in collections %}<article class="collection-card">{% if c.image_url %}<img src="{{ c.image_url }}" alt="{{ c.title }}" style="width:100%;height:160px;object-fit:cover;border-radius:12px" loading="lazy">{% else %}<span>{{ c.emoji }}</span>{% endif %}<h3>{{ c.title }}</h3><p>{{ c.description }}</p><a href="/best/{{ c.slug }}">추천 모음 보기 →</a></article>{% else %}<p>추천 모음을 준비 중입니다.</p>{% endfor %}</div>
