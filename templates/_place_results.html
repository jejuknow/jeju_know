  <section class="section wrap" id="places">
    <div class="section-head">
      <div><p class="kicker">SEARCH RESULT</p><h2>조건에 맞는 장소</h2><p id="resultSummary" class="section-copy" role="status">장소 데이터를 불러오는 중입니다.</p></div>
      <button class="text-btn" id="resetBtn">필터 초기화</button>
    </div>
    <div id="placeGrid" class="place-grid compact-place-grid" aria-live="polite"></div>
    <div class="results-footer"><a class="primary-inline" id="finderMapLink" href="/map{% if request.url.query %}?{{ request.url.query }}{% endif %}">지도에서 보기 →</a><a class="text-btn" id="allResultsBtn" href="/places" hidden>전체 결과 보기 →</a></div>
    <div id="emptyState" class="empty-state" hidden><div class="empty-emoji">🔎</div><h3>선택한 조건에 맞는 장소가 아직 없습니다.</h3><p>현재 공개된 정보만 기준으로 보여드리고 있어요.<br>조건을 조금 줄여보세요.</p><a id="finderRegisterLink" class="text-btn" href="/map/register">MAP에서 장소 알려주기 →</a></div>
  </section>
