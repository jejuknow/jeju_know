{% set food = taxonomy.categories|selectattr('slug','equalto','food')|first %}
{% if food %}
<div class="restaurant-fields form-grid two span-2" data-restaurant-fields data-food-id="{{ food.id }}" {% if p.get('category_id')|string != food.id|string %}hidden{% endif %}>
  <input type="hidden" name="restaurant_taxonomy_present" value="1">
  <label>맛집 대분류{{ ' *' if restaurant_required else '' }}<select name="restaurant_main_id" data-required="{{ '1' if restaurant_required and not p.get('id') else '0' }}">
    <option value="">{{ '기존 분류 유지 / 미분류' if p.get('id') else '선택해주세요' }}</option>
    {% for t in taxonomy.terms if t.parent_id==food.id and not t.is_legacy and (t.is_active or t.id|string==p.get('restaurant_main_id')|string) %}<option value="{{ t.id }}" {% if t.id|string==p.get('restaurant_main_id')|string %}selected{% endif %}>{{ t.name }}{{ ' (비활성 · 기존 분류)' if not t.is_active else '' }}</option>{% endfor %}
  </select></label>
  <label>맛집 세부유형 (선택)<select name="restaurant_subtype_id"><option value="">대분류만 선택</option>{% for t in taxonomy.terms if t.type=='restaurant_subcategory' and t.parent_id!=food.id and not t.is_legacy and (t.is_active or t.id|string==p.get('restaurant_subtype_id')|string) %}<option data-parent="{{ t.parent_id }}" value="{{ t.id }}" {% if t.id|string==p.get('restaurant_subtype_id')|string %}selected{% endif %}>{{ t.name }}{{ ' (비활성 · 기존 분류)' if not t.is_active else '' }}</option>{% endfor %}</select></label>
  <p class="form-help span-2">세부유형을 모르면 대분류만 골라도 좋아요. 대표메뉴는 분류와 별도로 입력해주세요.</p>
  {% if p.get('restaurant_ambiguous') %}<div class="span-2"><p class="form-help">기존 분류: {{ p.restaurant_existing_labels }}. 기존 연결을 보존합니다.</p><label class="check"><input type="checkbox" name="restaurant_replace" value="1">기존 분류를 위 선택으로 교체</label></div>{% endif %}
</div>
{% endif %}
