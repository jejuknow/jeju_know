{% extends "base.html" %}
{% block title %}관리자 최초 설정 | JEJUNO{% endblock %}
{% block body_class %}admin-body{% endblock %}
{% block body %}
<main class="auth-wrap"><section class="auth-card"><a class="brand" href="{{ url_for('home') }}"><strong>JEJUNO</strong><span>관리자 최초 설정</span></a><h1>관리자 계정 만들기</h1><p class="auth-copy">최초 1회만 실행됩니다. 계정을 만든 뒤에는 이 화면에 다시 접근할 수 없습니다.</p>{% include '_flashes.html' %}<form method="post" class="admin-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>관리자 아이디<input name="username" minlength="3" required autocomplete="username"></label><label>비밀번호<input type="password" name="password" minlength="8" required autocomplete="new-password"></label><label>비밀번호 확인<input type="password" name="password_confirm" minlength="8" required autocomplete="new-password"></label><button class="primary-btn" type="submit">관리자 계정 만들기</button></form></section></main>
{% endblock %}
