<article class="compact-place-card"><div class="compact-place-visual">{% if p.image_url %}<img src="{{ p.image_url }}" alt="{{ p.name }}" loading="lazy">{% else %}<span>{{ p.emoji }}</span>{% endif %}</div><div class="compact-place-body"><p class="compact-place-meta">{{ region_labels.get(p.region,p.region) }} · {{ p.category }}</p><p class="place-provenance">{{ p.status_label }}</p><h3>{{ p.name }}</h3><p class="compact-place-reason">{{ p.one_line }}</p><a class="detail-link" href="/place/{{ p.slug }}">상세보기 →</a></div></article>
