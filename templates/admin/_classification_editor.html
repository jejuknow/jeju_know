{% macro editor(item=none, parent_id=none, return_to=none) %}<form method="post" class="admin-form" action="{{ '/admin/classifications/'~kind if is_catalog else '/admin/categories/'~(item.id|string~'/edit' if item else 'new') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="next" value="{{ return_to or '/admin/classifications/'~kind }}"><input type="hidden" name="type" value="{{ kind }}">{% if is_catalog %}<input type="hidden" name="action" value="{{ 'edit' if item else 'new' }}">{% endif %}<label>이름<input name="name" maxlength="40" required value="{{ item.name if item else '' }}"></label><label>{{ '저장 식별자' if is_catalog else '슬러그' }}<input name="{{ 'value' if is_catalog else 'slug' }}" maxlength="{{ 40 if is_catalog else 80 }}" value="{{ (item.value if is_catalog else item.slug) if item else '' }}" {% if item %}readonly{% endif %} required><small>{{ '기존 장소 값과 공유 URL을 유지하기 위해 생성 후 식별자는 변경하지 않습니다.' if item else ('영문 소문자·숫자·하이픈으로 고유한 슬러그를 입력하세요.' if kind=='restaurant_subcategory' else '카페 성향·슬러그는 영문 소문자, 지역·동행은 구분할 이름을 입력하세요.') }}</small></label>{% if kind=='restaurant_subcategory' %}<label>상위 분류<select name="parent_id">{% for parent in restaurant_parents if not item or parent.id!=item.id %}<option value="{{ parent.id }}" {% if (item and item.parent_id==parent.id) or (not item and parent.id==(parent_id if parent_id is not none else food_id)) %}selected{% endif %}>{{ '맛집 — 대분류로 등록' if parent.id==food_id else parent.name }}{{ ' (비활성)' if not parent.is_active else '' }}</option>{% endfor %}</select></label>{% if item and item.is_legacy %}<label class="check"><input type="checkbox" name="adopt_legacy" value="1">기존 값의 의미를 확인했으며 선택 가능한 분류로 전환</label>{% endif %}{% endif %}{% if kind=='cafe_feature' %}<label>회원 선택 권한<select name="member_policy"><option value="review" {% if not item or item.member_policy!='admin' %}selected{% endif %}>제안 가능 · 관리자 승인 후 반영</option><option value="admin" {% if item and item.member_policy=='admin' %}selected{% endif %}>관리자 전용</option></select><small>동일한 분류 ID를 사용하며 회원의 공식값 직접 지정은 허용하지 않습니다.</small></label>{% endif %}<label>노출 순서<input type="number" name="sort_order" value="{{ item.sort_order if item else 1 }}" min="0" max="9999" required></label><label class="check"><input type="checkbox" name="is_active" value="1" {% if not item or item.is_active %}checked{% endif %}>활성</label><button class="primary-inline">{{ '저장' if item else '추가하기' }}</button></form>{% endmacro %}
