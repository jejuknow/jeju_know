{% extends 'admin/base.html' %}
{% block admin_content %}<section class="admin-panel admin-editor-body"><h2>{{ 'BEST 수정' if collection else 'BEST 만들기' }}</h2><form class="admin-form" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>모음 제목<input name="title" value="{{ collection.title if collection else '' }}" maxlength="120" required></label><label>소개<textarea name="description" maxlength="2000" rows="3">{{ collection.description if collection else '' }}</textarea></label><label>대표 이미지 URL<input name="image_url" value="{{ collection.image_url if collection else '' }}" maxlength="2000" placeholder="https://... 또는 기존 /uploads/ 이미지 주소"></label><label>노출 순서<input type="number" name="sort_order" value="{{ collection.sort_order if collection else 0 }}" min="0" max="9999" required></label><label class="check"><input type="checkbox" name="published" value="1" {% if collection and collection.published %}checked{% endif %}>공개</label><div class="row-actions"><button class="primary-inline">저장</button><a class="secondary-btn" href="/admin/best">목록으로</a>{% if collection %}<a class="secondary-btn" href="/best/{{ collection.slug }}" target="_blank">방문자 화면 ↗</a>{% endif %}</div></form></section>
{% if collection %}<section class="admin-panel admin-editor-body"><h2>포함 장소 · 순서 관리</h2>{% for p in selected_places %}<form method="post" action="/admin/best/{{ collection.id }}/places" class="admin-best-item"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="place_id" value="{{ p.id }}"><a href="/admin/places/{{ p.id }}/edit">{{ p.name }}</a><label>순서<input type="number" name="sort_order" min="0" max="9999" value="{{ p.sort_order }}"></label><button class="mini-btn" name="action" value="add">순서 저장</button><button class="mini-btn" name="action" value="remove">모음에서 제외</button></form>{% else %}<p>포함된 장소가 없습니다.</p>{% endfor %}<form method="post" action="/admin/best/{{ collection.id }}/places" class="admin-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="action" value="add"><div class="form-grid two"><label>장소 선택<select name="place_id" required>{% for p in places %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}</select></label><label>순서<input type="number" name="sort_order" min="0" max="9999" value="0"></label></div><button class="primary-inline">+ 장소 추가</button></form></section>{% endif %}{% endblock %}
