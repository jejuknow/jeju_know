{% macro token(csrf) %}<input type="hidden" name="csrf_token" value="{{ csrf }}">{% endmacro %}
{% macro password_fields() %}<label>새 비밀번호<input type="password" name="password" required minlength="10" maxlength="128" autocomplete="new-password"></label>
<p class="form-help">10~128자로 입력하세요. 문자와 숫자를 함께 사용하기를 권장합니다.</p>
<label>새 비밀번호 확인<input type="password" name="password_confirm" required minlength="10" maxlength="128" autocomplete="new-password"></label>{% endmacro %}
{% macro current_password() %}<label>현재 비밀번호<input type="password" name="current_password" required maxlength="128" autocomplete="current-password"></label>{% endmacro %}
