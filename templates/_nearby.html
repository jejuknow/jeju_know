<div class="nearby-controls" role="group" aria-label="현재 위치와 주변 탐색">
  <button type="button" data-locate><span aria-hidden="true">📍</span> 내 위치</button>
  <button type="button" data-near-toggle disabled aria-pressed="false">내 주변</button>
  <label>반경 <select data-radius disabled>{% for km in [1, 3, 5, 10] %}<option value="{{ km }}" {% if km == 5 %}selected{% endif %}>{{ km }}km</option>{% endfor %}</select></label>
  <small role="status" data-location-message>내 위치를 확인하면 주변을 탐색할 수 있어요.</small>
</div>
